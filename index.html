
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Grade Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h2 class="sr-only">CGPA grade checker — enter your CGPA to see your class of degree</h2>

  <div class="grade-card">
    <p>Enter CGPA (0.00 – 5.00)</p>
<div>
      <audio id="success-Sound" src="success.mp3" ></audio>
<audio id="failure-Sound" src="./failure.mp3" ></audio>
<audio id="kill-Sound" src="./kill.mp3" ></audio>
<audio id="giveaway-Sound" src="./giveaway.mp3" ></audio>
<audio id="oh-chim-Sound" src="./oh chim.mp3" ></audio>
<audio id="secondfail-Sound" src="./secondfail.mp3" ></audio>
</div>
    <div class="input-group">
      <input type="number" id="cgpa-input" min="0" max="5" step="0.01" placeholder="e.g. 4.75" />
      <button onclick="checkGrade()">Check grade</button>
    </div>

    <div id="result-box" class="result-box">
      <div>
        <div id="result-icon"></div>
        <div>
          <p id="result-class"></p>
          <p id="result-range"></p>
        </div>
      </div>
    </div>

    <p id="error-msg">Please enter a valid CGPA between 0.00 and 5.00.</p>
  </div>
</div>

<audio id="success-sound" src="success.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
